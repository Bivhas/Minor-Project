<!DOCTYPE html> <!-- Declares this as an HTML5 document -->
<html lang="en"> <!-- Sets the page language to English -->
<head>
  <meta charset="UTF-8"> <!-- Supports all characters/symbols -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page responsive on mobile devices -->
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css"> <!-- Links the external CSS file for styling -->
</head>
<body>

<div class="container">
  <h2 id="formTitle">Login</h2> <!-- Title changes dynamically between "Login" and "Create Account" -->

  <input type="text" id="username" placeholder="Enter Username"> <!-- Username input field -->
  <input type="password" id="password" placeholder="Enter Password"> <!-- Password input — 'type=password' hides the typed characters -->

  <button onclick="handleAction()">Login</button> <!-- Calls handleAction() on click; label switches between Login/Register -->

  <div class="toggle" onclick="toggleForm()"> <!-- Clicking this switches between Login and Register mode -->
    Create New Account
  </div>

  <div class="message" id="message"></div> <!-- Displays success or error messages to the user -->
</div>

<script>
  let isLogin = true; // Tracks current mode: true = Login, false = Register

  let users = {}; // Acts as an in-memory "database" to store registered usernames and passwords

  function toggleForm() {
    isLogin = !isLogin; // Flips the mode between Login and Register

    // Updates the form title based on current mode
    document.getElementById("formTitle").innerText =
      isLogin ? "Login" : "Create Account";

    // Updates the button label to match the current mode
    document.querySelector("button").innerText =
      isLogin ? "Login" : "Register";

    // Updates the toggle link text to offer the opposite action
    document.querySelector(".toggle").innerText =
      isLogin
        ? "Create New Account"
        : "Already have an account? Login";

    document.getElementById("message").innerText = ""; // Clears any previous message when switching modes
  }

  function handleAction() {
    let username = document.getElementById("username").value; // Gets the entered username
    let password = document.getElementById("password").value; // Gets the entered password
    let message = document.getElementById("message");

    // Validates that both fields are filled before proceeding
    if (username === "" || password === "") {
      message.style.color = "red";
      message.innerText = "Please fill all fields.";
      return; // Stops execution if validation fails
    }

    if (isLogin) {
      // LOGIN FLOW
      if (users[username] && users[username] === password) { // Checks if username exists and password matches
        message.style.color = "green";
        message.innerText = "Login Successful!";
        window.location.href = "homepage.html"; // Redirects user to the homepage on success
      } else {
        message.style.color = "red";
        message.innerText = "Invalid Username or Password."; // Shown when credentials don't match
      }

    } else {
      // REGISTER FLOW
      if (users[username]) { // Prevents duplicate usernames
        message.style.color = "red";
        message.innerText = "Username already exists.";
      } else {
        users[username] = password; // Saves the new user to the in-memory store
        message.style.color = "green";
        message.innerText = "Account Created Successfully!";
        window.location.href = "homepage.html"; // Redirects to homepage after successful registration
      }
    }
  }
</script>

</body>
</html>
