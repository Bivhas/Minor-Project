<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUSH - Secure Messaging</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-primary: #f0f2f5;
      --bg-secondary: #f8f9fa;
      --bg-white: #ffffff;
      --text-primary: #1c1e21;
      --text-secondary: #65676b;
      --border-color: #dadde1;
      --message-bg: #e4e6ea;
      --message-sent: #0084ff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.15);
      --border-radius: 8px;
      --transition: all 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.4;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP BAR */
    .topbar {
      background: var(--primary-color);
      color: white;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* MAIN CONTAINER */
    .main-container {
      display: flex;
      height: calc(100vh - 80px);
      max-width: 1400px;
      margin: 0 auto;
      background: var(--bg-white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 360px;
      min-width: 320px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h2 {
      color: var(--primary-color);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .search-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .search-box {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: 0.95rem;
      transition: var(--transition);
      background: var(--bg-white);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem;
    }

    .user {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-white);
      border-radius: var(--border-radius);
      margin-bottom: 0.5rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
      text-decoration: none;
    }

    .user:hover,
    .user.active {
      background: #e3f2fd;
      border-color: var(--primary-color);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }

    .user-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    .user-info p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* CHAT SECTION */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-white);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .chat-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .chat-box {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      background: linear-gradient(180deg, #f8f9fa 0%, #f0f2f5 100%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.received {
      align-self: flex-start;
    }

    .message.sent {
      align-self: flex-end;
    }

    .sender-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--primary-color);
      margin-bottom: 0.25rem;
    }

    .message-text {
      padding: 0.75rem 1rem;
      border-radius: var(--border-radius);
      background: var(--bg-white);
      box-shadow: var(--shadow-sm);
      word-wrap: break-word;
      line-height: 1.4;
    }

    .message.sent .message-text {
      background: var(--primary-color);
      color: white;
    }

    /* INPUT AREA */
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--bg-white);
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .message-input {
      flex: 1;
      resize: vertical;
      min-height: 44px;
      max-height: 120px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.4;
      transition: var(--transition);
    }

    .message-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }

    .send-button {
      width: 56px;
      height: 44px;
      border: none;
      background: var(--primary-color);
      color: white;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .send-button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* EMPTY STATE */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-align: center;
      padding: 2rem;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        height: 100vh;
        border-radius: 0;
        margin: 0;
      }
      
      .sidebar {
        width: 100%;
        height: 50vh;
        max-height: 50vh;
      }
      
      .chat-section {
        height: 50vh;
      }
    }

    /* SCROLLBAR */
    .users-list::-webkit-scrollbar,
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }

    .users-list::-webkit-scrollbar-track,
    .chat-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .users-list::-webkit-scrollbar-thumb,
    .chat-box::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    /* ACCESSIBILITY */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- TOP BAR -->
  <header class="topbar">
    HUSH
  </header>

  <!-- MAIN APP -->
  <main class="main-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" role="complementary" aria-label="Chat list">
      <div class="sidebar-header">
        <h2>Chats</h2>
      </div>
      
      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input 
          type="text" 
          class="search-box"
          id="searchInput"
          placeholder="Search chats..."
          autocomplete="off"
        >
      </div>

      <div class="users-list" id="usersList" role="listbox" aria-label="Available chats">
        <!-- Users populated by JavaScript -->
      </div>
    </aside>

    <!-- CHAT SECTION -->
    <section class="chat-section" role="main" aria-label="Chat conversation">
      <header class="chat-header">
        <h2 id="chatHeader">Select a chat to start messaging</h2>
      </header>

      <div class="chat-box" id="chatBox" role="log" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">💬</div>
          <h3>Select a chat to start messaging</h3>
          <p>Choose a conversation from the sidebar</p>
        </div>
      </div>

      <div class="input-area">
        <textarea 
          id="messageInput"
          class="message-input"
          placeholder="Type your message..."
          rows="1"
          aria-label="Message input"
          maxlength="1000"
        ></textarea>
        <button 
          id="sendButton"
          class="send-button"
          aria-label="Send message"
          disabled
        >
          ➤
        </button>
      </div>
    </section>
  </main>

  <script>
    class HushChat {
      constructor() {
        this.chats = {
          'You': [],
          'Alice': [],
          'Bob': [],
          'Charlie': []
        };
        this.currentUser = null;
        this.users = Object.keys(this.chats);
        
        this.init();
      }

      init() {
        this.bindEvents();
        this.renderUsers();
        this.selectUser('You');
        this.updateSendButtonState();
      }

      bindEvents() {
        const searchInput = document.getElementById('searchInput');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        searchInput.addEventListener('input', (e) => this.filterUsers(e.target.value));
        messageInput.addEventListener('input', () => this.updateSendButtonState());
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        });
        sendButton.addEventListener('click', () => this.sendMessage());

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
          messageInput.style.height = 'auto';
          messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });
      }

      renderUsers() {
        const usersList = document.getElementById('usersList');
        usersList.innerHTML = this.users.map(user => `
          <div class="user" role="option" tabindex="0" data-user="${user}" aria-selected="false">
            <div class="user-avatar">${user.charAt(0)}</div>
            <div class="user-info">
              <h3>${user === 'You' ? 'Saved Messages' : user}</h3>
              <p>${this.getLastMessagePreview(user)}</p>
            </div>
          </div>
        `).join('');

        // Add click and keyboard events to users
        document.querySelectorAll('.user').forEach(userEl => {
          userEl.addEventListener('click', (e) => this.handleUserSelect(e.currentTarget.dataset.user));
          userEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.handleUserSelect(e.currentTarget.dataset.user);
            }
          });
        });
      }

      filterUsers(query) {
        const usersList = document.getElementById('usersList');
        const filtered = this.users.filter(user => 
          user.toLowerCase().includes(query.toLowerCase())
        );
        
        usersList.innerHTML = filtered.map(user => `
          <div class="user" role="option" tabindex="0" data-user="${user}" aria-selected="false">
            <div class="user-avatar">${user.charAt(0)}</div>
            <div class="user-info">
              <h3>${user === 'You' ? 'Saved Messages' : user}</h3>
              <p>${this.getLastMessagePreview(user)}</p>
            </div>
          </div>
        `).join('');

        this.bindUserEvents();
      }

      bindUserEvents() {
        document.querySelectorAll('.user').forEach(userEl => {
          userEl.addEventListener('click', (e) => this.handleUserSelect(e.currentTarget.dataset.user));
          userEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.handleUserSelect(e.currentTarget.dataset.user);
            }
          });
        });
      }

      handleUserSelect(user) {
        this.selectUser(user);
        
        // Update active state
        document.querySelectorAll('.user').forEach(el => {
          el.classList.remove('active');
          el.setAttribute('aria-selected', 'false');
        });
        document.querySelector(`[data-user="${user}"]`)?.classList.add('active');
        document.querySelector(`[data-user="${user}"]`)?.setAttribute('aria-selected', 'true');
      }

      selectUser(name) {
        this.currentUser = name;
        document.getElementById('chatHeader').textContent = name === 'You' ? 'Saved Messages' : name;
        document.getElementById('emptyState')?.remove();
        this.loadMessages();
      }

      loadMessages() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';

        if (!this.chats[this.currentUser]?.length) {
          chatBox.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">✨</div>
              <h3>No messages yet</h3>
              <p>Start a conversation!</p>
            </div>
          `;
          return;
        }

        this.chats[this.currentUser].forEach((msg, index) => {
          const isSent = true; // All messages are from user in this demo
          const messageDiv = this.createMessageElement(msg, isSent, index === 0 ? this.currentUser : '');
          chatBox.appendChild(messageDiv);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
      }

      createMessageElement(text, isSent, senderName = '') {
        const div = document.createElement('div');
        div.className = `message ${isSent ? 'sent' : 'received'}`;
        div.innerHTML = `
          ${senderName ? `<div class="sender-name">${senderName}</div>` : ''}
          <div class="message-text">${this.escapeHtml(text)}</div>
        `;
        return div;
      }

      sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value.trim();

        if (!message || !this.currentUser) return;

        if (!this.chats[this.currentUser]) {
          this.chats[this.currentUser] = [];
        }

        this.chats[this.currentUser].push(message);
        messageInput.value = '';
        this.updateSendButtonState();
        this.loadMessages();
        this.updateUsersList();
      }

      updateSendButtonState() {
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const hasText = messageInput.value.trim().length > 0;
        const hasUser = !!this.currentUser;

        sendButton.disabled = !(hasText && hasUser);
      }

      getLastMessagePreview(user) {
        const messages = this.chats[user];
        if (!messages?.length) return 'No messages yet';
        return this.escapeHtml(messages[messages.length - 1]).slice(0, 30) + (messages[messages.length - 1].length > 30 ? '...' : '');
      }

      updateUsersList() {
        this.renderUsers();
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    // Initialize app when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new HushChat();
    });
  </script>
</body>
</html>
