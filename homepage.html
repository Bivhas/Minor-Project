<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUSH - Secure Messaging</title>
  <link rel="stylesheet" href="homepagestyle.css">
</head>

<body>
  <!-- TOP BAR -->
  <header class="topbar">
    HUSH
  </header>

  <!-- MAIN APP -->
  <main class="main-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" role="complementary" aria-label="Chat list">
      <div class="sidebar-header">
        <h2>Chats</h2>
      </div>
      
      <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input 
          type="text" 
          class="search-box"
          id="searchInput"
          placeholder="Search chats..."
          autocomplete="off"
        >
      </div>

      <div class="users-list" id="usersList" role="listbox" aria-label="Available chats">
        <!-- Users populated by JavaScript -->
      </div>
    </aside>

    <!-- CHAT SECTION -->
    <section class="chat-section" role="main" aria-label="Chat conversation">
      <header class="chat-header">
        <h2 id="chatHeader">Select a chat to start messaging</h2>
      </header>

      <div class="chat-box" id="chatBox" role="log" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">💬</div>
          <h3>Select a chat to start messaging</h3>
          <p>Choose a conversation from the sidebar</p>
        </div>
      </div>

      <div class="input-area">
        <textarea 
          id="messageInput"
          class="message-input"
          placeholder="Type your message..."
          rows="1"
          aria-label="Message input"
          maxlength="1000"
        ></textarea>
        <button 
          id="sendButton"
          class="send-button"
          aria-label="Send message"
          disabled
        >
          ➤
        </button>
      </div>
    </section>
  </main>

  <script>
    class HushChat {
      constructor() {
        this.chats = {
          'You': [],
          'Alice': [],
          'Bob': [],
          'Charlie': []
        };
        this.currentUser = null;
        this.users = Object.keys(this.chats);
        
        this.init();
      }

      init() {
        this.bindEvents();
        this.renderUsers();
        this.selectUser('You');
        this.updateSendButtonState();
      }

      bindEvents() {
        const searchInput = document.getElementById('searchInput');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        searchInput.addEventListener('input', (e) => this.filterUsers(e.target.value));
        messageInput.addEventListener('input', () => this.updateSendButtonState());
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        });
        sendButton.addEventListener('click', () => this.sendMessage());

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
          messageInput.style.height = 'auto';
          messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });
      }

      renderUsers() {
        const usersList = document.getElementById('usersList');
        usersList.innerHTML = this.users.map(user => `
          <div class="user" role="option" tabindex="0" data-user="${user}" aria-selected="false">
            <div class="user-avatar">${user.charAt(0)}</div>
            <div class="user-info">
              <h3>${user === 'You' ? 'Saved Messages' : user}</h3>
              <p>${this.getLastMessagePreview(user)}</p>
            </div>
          </div>
        `).join('');

        // Add click and keyboard events to users
        document.querySelectorAll('.user').forEach(userEl => {
          userEl.addEventListener('click', (e) => this.handleUserSelect(e.currentTarget.dataset.user));
          userEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.handleUserSelect(e.currentTarget.dataset.user);
            }
          });
        });
      }

      filterUsers(query) {
        const usersList = document.getElementById('usersList');
        const filtered = this.users.filter(user => 
          user.toLowerCase().includes(query.toLowerCase())
        );
        
        usersList.innerHTML = filtered.map(user => `
          <div class="user" role="option" tabindex="0" data-user="${user}" aria-selected="false">
            <div class="user-avatar">${user.charAt(0)}</div>
            <div class="user-info">
              <h3>${user === 'You' ? 'Saved Messages' : user}</h3>
              <p>${this.getLastMessagePreview(user)}</p>
            </div>
          </div>
        `).join('');

        this.bindUserEvents();
      }

      bindUserEvents() {
        document.querySelectorAll('.user').forEach(userEl => {
          userEl.addEventListener('click', (e) => this.handleUserSelect(e.currentTarget.dataset.user));
          userEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              this.handleUserSelect(e.currentTarget.dataset.user);
            }
          });
        });
      }

      handleUserSelect(user) {
        this.selectUser(user);
        
        // Update active state
        document.querySelectorAll('.user').forEach(el => {
          el.classList.remove('active');
          el.setAttribute('aria-selected', 'false');
        });
        document.querySelector(`[data-user="${user}"]`)?.classList.add('active');
        document.querySelector(`[data-user="${user}"]`)?.setAttribute('aria-selected', 'true');
      }

      selectUser(name) {
        this.currentUser = name;
        document.getElementById('chatHeader').textContent = name === 'You' ? 'Saved Messages' : name;
        document.getElementById('emptyState')?.remove();
        this.loadMessages();
      }

      loadMessages() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';

        if (!this.chats[this.currentUser]?.length) {
          chatBox.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">✨</div>
              <h3>No messages yet</h3>
              <p>Start a conversation!</p>
            </div>
          `;
          return;
        }

        this.chats[this.currentUser].forEach((msg, index) => {
          const isSent = true; // All messages are from user in this demo
          const messageDiv = this.createMessageElement(msg, isSent, index === 0 ? this.currentUser : '');
          chatBox.appendChild(messageDiv);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
      }

      createMessageElement(text, isSent, senderName = '') {
        const div = document.createElement('div');
        div.className = `message ${isSent ? 'sent' : 'received'}`;
        div.innerHTML = `
          ${senderName ? `<div class="sender-name">${senderName}</div>` : ''}
          <div class="message-text">${this.escapeHtml(text)}</div>
        `;
        return div;
      }

      sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const message = messageInput.value.trim();

        if (!message || !this.currentUser) return;

        if (!this.chats[this.currentUser]) {
          this.chats[this.currentUser] = [];
        }

        this.chats[this.currentUser].push(message);
        messageInput.value = '';
        this.updateSendButtonState();
        this.loadMessages();
        this.updateUsersList();
      }

      updateSendButtonState() {
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const hasText = messageInput.value.trim().length > 0;
        const hasUser = !!this.currentUser;

        sendButton.disabled = !(hasText && hasUser);
      }

      getLastMessagePreview(user) {
        const messages = this.chats[user];
        if (!messages?.length) return 'No messages yet';
        return this.escapeHtml(messages[messages.length - 1]).slice(0, 30) + (messages[messages.length - 1].length > 30 ? '...' : '');
      }

      updateUsersList() {
        this.renderUsers();
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    }

    // Initialize app when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new HushChat();
    });
  </script>
</body>
</html>
